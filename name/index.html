<script>
const PORTRAITS = (() => {
const W = 40, H = 48;

/* ── 01. 고정 팔레트 — 색 수는 아래 정의가 곧 사실이다 ── */
const PAL = {
  '1':'#1A1410','2':'#2E241C',                                  // 외곽 2
  '3':'#E8C39A','4':'#F5DDBC','5':'#B08560','6':'#8A5F3E',      // 피부 4
  '7':'#C0594A','8':'#E08A72','9':'#8A3328',                    // 홍안 3
  'a':'#14100C','b':'#3A2C20','c':'#5A4632',                    // 모발 흑 3
  'd':'#C9C3B4','e':'#EFEAE0',                                  // 모발 백 2
  'f':'#C8CDD4','g':'#EFF2F5','h':'#7A8288','i':'#4A5058',      // 철 4
  'j':'#D9B04A','k':'#F0D98A','l':'#8A6A2A',                    // 금 3
  'm':'#3E8E5A','n':'#5FB07C','o':'#256641',                    // 촉 3
  'p':'#2F5FA8','q':'#5E8FD0','r':'#1C3E72',                    // 위 3
  's':'#B8392F','t':'#D9695E','u':'#7A1F18',                    // 오 3
  'v':'#6B4C8A','w':'#9878BE','x':'#452C60',                    // 군웅 3
  'y':'#C9342A','z':'#F7F1DC'                                   // 적 · 백 2
};
const PAL_LABEL = {
  '1':'외곽','2':'외곽명','3':'피부','4':'피부명','5':'피부암','6':'피부짙',
  '7':'홍안','8':'홍안명','9':'홍안암','a':'흑발','b':'흑발명','c':'흑발밝',
  'd':'백발','e':'백발명','f':'철','g':'철명','h':'철암','i':'철짙',
  'j':'금','k':'금명','l':'금암','m':'촉','n':'촉명','o':'촉암',
  'p':'위','q':'위명','r':'위암','s':'오','t':'오명','u':'오암',
  'v':'군웅','w':'군웅명','x':'군웅암','y':'적','z':'백'
};
// 세력 자리표시자 F/G/H → 실제 3색
const FACTION = { '촉':['m','n','o'], '위':['p','q','r'], '오':['s','t','u'], '군':['v','w','x'] };

/* ── 그리드 유틸 ─────────────────────────────── */
const grid = (w, h, fill) => Array.from({length:h}, () => Array(w).fill(fill));
function stamp(g, art, ox, oy, remap) {
  art.forEach((row, y) => {
    [...row].forEach((ch, x) => {
      if (ch === '.') return;
      const c = remap && remap[ch] ? remap[ch] : ch;
      const gy = y + oy, gx = x + ox;
      if (gy >= 0 && gy < g.length && gx >= 0 && gx < g[0].length) g[gy][gx] = c;
    });
  });
}
function paint(cv, g) {
  const ctx = cv.getContext('2d');
  ctx.clearRect(0, 0, cv.width, cv.height);
  g.forEach((row, y) => row.forEach((ch, x) => {
    const col = PAL[ch];
    if (!col) return;
    ctx.fillStyle = col; ctx.fillRect(x, y, 1, 1);
  }));
}

/* ── 레이아웃 규약 (40 × 48) ────────────────────
   y 2–11  투구 · 관        y 7–31  얼굴 (중심 19)
   y 18–21 눈               y 25–33 수염
   y 29–34 목               y 33–47 어깨 · 갑주
   ───────────────────────────────────────────── */
const FACE_CX = 20, FACE_CY = 19;
const NECK_TOP = 29, ARMOR_TOP = 33;

const SKIN = {
  normal: { base:'3', hi:'4', sh:'5', deep:'6' },
  pale:   { base:'4', hi:'z', sh:'3', deep:'5' },   // 문관 · 병약
  tan:    { base:'5', hi:'3', sh:'6', deep:'1' },   // 야전 · 볕에 그을림
  dark:   { base:'6', hi:'5', sh:'1', deep:'1' },   // 서량 · 이민족
  red:    { base:'7', hi:'8', sh:'9', deep:'1' }    // 관우 전용 홍안
};

/* ── 02. 얼굴 베이스 제너레이터 ──────────────── */
function faceBase(o) {
  const g = grid(W, H, '.');
  const S = SKIN[o.skin] || SKIN.normal;
  const rw = o.w, rh = o.h;
  const jaw = o.jaw / 10;

  const inside = (x, y) => {
    let w = rw;
    if (y > FACE_CY) w = rw * (1 - jaw * ((y - FACE_CY) / rh) * 0.8);
    const dx = (x - FACE_CX) / w, dy = (y - FACE_CY) / rh;
    return dx * dx + dy * dy <= 1;
  };

  // 목 (얼굴보다 먼저 — 얼굴이 위에 덮는다)
  for (let y = NECK_TOP; y < ARMOR_TOP + 1; y++)
    for (let x = FACE_CX - 4; x <= FACE_CX + 4; x++) {
      const edge = (x === FACE_CX - 4 || x === FACE_CX + 4);
      g[y][x] = edge ? '1' : (x < FACE_CX ? S.base : S.sh);
    }

  // 얼굴
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    if (!inside(x, y)) continue;
    const dx = (x - FACE_CX) / rw, dy = (y - FACE_CY) / rh;
    const d = Math.sqrt(dx * dx + dy * dy);
    const lit = (-dx - dy) / 2;
    let c = S.base;
    if (d > 0.80) c = S.sh;
    else if (lit > 0.32) c = S.hi;
    if (d > 0.80 && lit < -0.25) c = S.deep;
    g[y][x] = c;
  }
  // 외곽선
  const out = g.map(r => r.slice());
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    if (g[y][x] !== '.') continue;
    const near = [[0,1],[0,-1],[1,0],[-1,0]].some(([dy,dx]) => {
      const yy = y + dy, xx = x + dx;
      return yy >= 0 && yy < H && xx >= 0 && xx < W && g[yy][xx] !== '.';
    });
    if (near) out[y][x] = '1';
  }
  // ── 이목구비 ──────────────────────────────
  const earOff = Math.round(rw - 9);
  stamp(out, EARS[o.ear || 'normal'], FACE_CX - 10 - earOff, FACE_CY - 2);
  stamp(out, NOSE[o.nose || 'straight'], FACE_CX - 2, FACE_CY + 2);
  stamp(out, BROW[o.brow || 'thin'], FACE_CX - 6, FACE_CY - 4);
  stamp(out, MOUTH[o.mouth || 'neutral'], FACE_CX - 4, FACE_CY + Math.round(rh * 0.62));
  if (o.age === 'old') stamp(out, WRINKLE, FACE_CX - 9, FACE_CY + Math.round(rh * 0.30));
  if (o.age === 'young') {                       // 젊은 얼굴 — 볼 하이라이트
    for (const dx of [-6, 6]) {
      const x = FACE_CX + dx, y = FACE_CY + 3;
      if (out[y] && out[y][x] && out[y][x] !== '.' && out[y][x] !== '1') out[y][x] = S.hi;
    }
  }
  return out;
}

/* ── 갑주 제너레이터 — 사다리꼴 + 종류별 문양 ── */
function stampArmor(g, kind, remap, tr) {
  tr = tr || TRIM.gold;
  const bot = H - 1;
  for (let y = ARMOR_TOP; y <= bot; y++) {
    const t = (y - ARMOR_TOP) / (bot - ARMOR_TOP);
    const half = Math.round(6 + t * 13);
    for (let x = FACE_CX - half; x <= FACE_CX + half; x++) {
      if (x < 0 || x >= W) continue;
      g[y][x] = (x === FACE_CX - half || x === FACE_CX + half) ? '1' : 'F';
    }
  }
  const put = (y, x, c) => { if (y >= 0 && y < H && x >= 0 && x < W && g[y][x] !== '.') g[y][x] = c; };

  if (kind === 'pangap') {                      // 판갑 — 금속 견갑 + 가슴 금장
    for (let y = ARMOR_TOP; y < ARMOR_TOP + 3; y++)
      for (let x = 0; x < W; x++) if (g[y][x] === 'F') put(y, x, y === ARMOR_TOP ? 'g' : 'f');
    for (let y = ARMOR_TOP + 4; y < ARMOR_TOP + 8; y++) { put(y, 5, 'f'); put(y, 6, 'f'); put(y, W-6, 'f'); put(y, W-7, 'f'); }
    for (let x = 17; x <= 22; x++) { put(ARMOR_TOP + 6, x, tr.m); put(ARMOR_TOP + 7, x, tr.d); }
  } else if (kind === 'chalgap') {              // 찰갑 — 가로 미늘
    for (let y = ARMOR_TOP + 1; y < H; y += 2)
      for (let x = 0; x < W; x++) if (g[y][x] === 'F') put(y, x, x % 2 ? 'h' : 'i');
  } else if (kind === 'dopo') {                 // 도포 — 여밈 + 금대
    for (let y = ARMOR_TOP; y < H; y++) { put(y, FACE_CX - 1, 'G'); put(y, FACE_CX, 'H'); }
    for (let x = 8; x < W - 8; x++) { put(ARMOR_TOP + 9, x, tr.m); put(ARMOR_TOP + 10, x, tr.d); }
  } else if (kind === 'yungbok') {              // 융복 — 가죽 테두리
    for (let y = ARMOR_TOP; y < H; y++)
      for (let x = 0; x < W; x++) if (g[y][x] === '1') put(y, x, 'c');
    for (let y = ARMOR_TOP + 3; y < ARMOR_TOP + 6; y++) { put(y, 12, 'H'); put(y, 13, 'H'); put(y, W-13, 'H'); put(y, W-14, 'H'); }
  }
  // 칼라 (목 감싸기)
  for (let x = FACE_CX - 6; x <= FACE_CX + 6; x++) put(ARMOR_TOP, x, x % 4 === 0 ? tr.h : 'G');
  // 세력색 치환
  for (let y = ARMOR_TOP; y < H; y++) for (let x = 0; x < W; x++)
    if (remap[g[y][x]]) g[y][x] = remap[g[y][x]];
}
const ARMOR = {
  pangap:  { n:'판갑' }, chalgap: { n:'찰갑' },
  dopo:    { n:'도포' }, yungbok: { n:'융복' }
};

/* ── 얼굴 이목구비 — 베이스 위에 얹는 작은 파츠 ── */
// 코 · 폭 5 · 얼굴 중앙
const NOSE = {
  straight: ['..4..', '..4..', '.454.', '16561'],
  hooked:   ['..4..', '..44.', '.4554', '16561'],
  broad:    ['.....', '.444.', '45554', '16661']
};
// 귀 · 폭 20 · 얼굴 좌우 끝
const EARS = {
  normal: ['5..................5',
           '35................53',
           '35................53',
           '.5................5.'],
  big:    ['5..................5',          // 유비 — 수견(垂肩)
           '35................53',
           '35................53',
           '35................53',
           '35................53',
           '.5................5.']
};
// 눈썹 · 폭 13
const BROW = {
  thin:   ['.aaa.....aaa.'],
  strong: ['aaaa.....aaaa'],
  angry:  ['aaa.......aaa', '..aa.....aa..'],
  arched: ['.aaaa...aaaa.'],
  baekmi: ['dddd.....dddd', '.ee.......ee.'],   // 마량 — 백미(白眉)
  bushy:  ['aaaa.....aaaa', 'aaa.......aaa']
};
// 입 · 폭 9
const MOUTH = {
  firm:    ['.6666666.'],
  neutral: ['..66666..'],
  grim:    ['.6.....6.', '..66666..']
};
// 주름 (노년) · 폭 18
const WRINKLE = ['5................5',
                 '.5..............5.',
                 '..5............5..'];

/* ── 03. 파츠 라이브러리 (손으로 그린 실루엣) ── */
// 투구 · 관 — 26 폭, ox 7 / oy 2
const HELM = {

  muguan: { n:'무장관', ox:7, oy:5, art:[
    '..........iiiiii..........',

  bongsi: { n:'봉시관', ox:7, oy:1, art:[

    '.......iifffggfffii.......',

  tugu:   { n:'전투구', ox:7, oy:4, art:[

function compose(cfg) {
  const fac = FACTION[cfg.faction] || FACTION['촉'];
  const remap = { F:fac[0], G:fac[1], H:fac[2] };
  const g = faceBase(Object.assign({}, AGE_FEAT[cfg.face.age] || {}, cfg.face));

  const eye = EYE[cfg.eye] || EYE.normal;
  stamp(g, eye.art, eye.ox, eye.oy);
  const bd = BEARD[cfg.beard] || BEARD.none;
  stamp(g, bd.art, bd.ox, bd.oy, HAIR[cfg.hair || 'black']);
  const acc = ACC[cfg.acc || 'none'];
  if (acc) stamp(g, acc.art, acc.ox, acc.oy);
  stampArmor(g, cfg.armor, remap, TRIM[cfg.trim || 'gold']);
  const hm = HELM[cfg.helm] || HELM.none;
  stamp(g, hm.art, hm.ox, hm.oy, remap);

  if (cfg.grade === 'ung') {                     // 각성 — 깃털 3 · 금테 · 견갑 금장
    stamp(g, ['y.y.y', 'yyyyy', '.yyy.', '..y..'], 18, 0);
    for (let x = 0; x < W; x++) if (g[H-1][x] !== '.') g[H-1][x] = 'j';
    for (let y = H - 12; y < H; y++)
      for (const x of [2, 3, 4, W - 3, W - 4, W - 5])
        if (g[y][x] !== '.' && g[y][x] !== '1') g[y][x] = (x === 3 || x === W - 4) ? 'k' : 'j';
    for (let y = ARMOR_TOP; y < H; y++) { if (g[y][FACE_CX] !== '.') g[y][FACE_CX] = 'j'; }
    for (const y of [ARMOR_TOP + 2, ARMOR_TOP + 3])
      for (let x = 8; x < W - 8; x++) if (g[y] && g[y][x] !== '.' && g[y][x] !== '1') g[y][x] = 'j';
  }
  return g;
}
